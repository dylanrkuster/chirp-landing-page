<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp - Listen to Bird Sounds</title>
    <meta name="apple-itunes-app" content="app-id=6752545176">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a5c3a, #267a4d, #145233);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 380px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
        }
        .badge img {
            height: 54px;
        }
        .redirect-note {
            margin-top: 24px;
            font-size: 13px;
            opacity: 0.5;
        }
    </style>
    <script>
        (function() {
            var appStoreURL = "https://apps.apple.com/us/app/chirp-listen-to-bird-sounds/id6752545176";
            var homeURL = "https://listen-to-birds.com";

            if (window.location.pathname.indexOf("/bird/") === 0) {
                window.location.replace(appStoreURL);
            } else {
                window.location.replace(homeURL);
            }
        })();
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">🐦</div>
        <h1>Chirp</h1>
        <p>Listen to beautiful bird sounds.<br>Redirecting you to the App Store…</p>
        <a class="badge" href="https://apps.apple.com/us/app/chirp-listen-to-bird-sounds/id6752545176">
            <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
                 alt="Download on the App Store">
        </a>
        <div class="redirect-note">Not redirecting? Tap the badge above.</div>
    </div>
</body>
</html>
